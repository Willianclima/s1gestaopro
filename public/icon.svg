<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4f46e5" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Ring / Shield shape -->
  <g filter="url(#glow)">
    <path d="M 256,80 L 392,128 C 392,260 336,368 256,420 C 176,368 120,260 120,128 Z" fill="url(#shieldGrad)" stroke="#818cf8" stroke-width="6" />
  </g>

  <!-- Wrench and Gear Icon Graphic inside Shield -->
  <g fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" transform="translate(156, 140)">
    <!-- Gear Ring -->
    <circle cx="100" cy="100" r="48" stroke="#ffffff" stroke-width="18" fill="none" />
    <!-- Gear Teeth -->
    <path d="M 100,36 L 100,20 M 100,165 L 100,180 M 36,100 L 20,100 M 165,100 L 180,100 M 55,55 L 43,43 M 145,145 L 157,157 M 145,55 L 157,43 M 55,145 L 43,157" stroke="#ffffff" stroke-width="14" />
    
    <!-- Diagonal Wrench -->
    <path d="M 150,50 L 195,10 C 205,0 220,0 230,10 L 230,10 C 240,20 240,35 230,45 L 185,85" stroke="#a5b4fc" stroke-width="20" />
    <!-- Letter G Accent -->
    <text x="100" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" fill="#ffffff" text-anchor="middle" stroke="none">G</text>
  </g>
</svg>
